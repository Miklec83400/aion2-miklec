name: Annonces (lancement à la main seulement)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/news_auto.py
      - run: |
          if [ -n "$(git status --porcelain news-auto.json)" ]; then
            git config user.name "aion2-news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add news-auto.json
            git commit -m "Annonces officielles : mise à jour automatique"
            git push
          fi

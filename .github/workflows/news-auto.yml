name: Annonces (mardi 22 h et mercredi 14 h, heure de Paris)
on:
  schedule:
    - cron: "0 21 * * 2"   # mardi 22 h à Paris (heure d'hiver, UTC+1), avant la maintenance
    - cron: "0 13 * * 3"   # mercredi 14 h à Paris, après la maintenance
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/news_auto.py
      - run: |
          if [ -n "$(git status --porcelain news-auto.json)" ]; then
            git config user.name "aion2-news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add news-auto.json
            git commit -m "Annonces officielles : mise à jour automatique"
            git push
          fi
